{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="animate-fade-in max-w-md mx-auto mt-20">
    <div class="glass-card p-8 rounded-xl text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-100 mb-6">
            <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z">
                </path>
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-gray-900 mb-2">Create Account</h1>
        <p class="text-gray-600 mb-8">Sign up to access admin features</p>

        <form method="POST" class="space-y-6 text-left">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input name="username" type="text" required
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-white/50 backdrop-blur-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input name="email" type="email" required
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-white/50 backdrop-blur-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input name="password" type="password" required
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-white/50 backdrop-blur-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                <input name="confirm_password" type="password" required
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-white/50 backdrop-blur-sm">
            </div>

            <button type="submit"
                class="w-full btn-primary py-2 rounded-lg shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5 bg-indigo-600 hover:bg-indigo-700 text-white">
                Sign Up
            </button>
        </form>

        <p class="mt-4 text-sm text-gray-600">
            Already have an account?
            <a href="{{ url_for('login') }}" class="text-indigo-600 hover:text-indigo-500 font-medium">Login</a>
        </p>
    </div>
</div>
{% endblock %}
