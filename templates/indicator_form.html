{% extends "base.html" %}
{% block title %}Indicator Form{% endblock %}

{% block content %}
<div class="animate-fade-in max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold mb-6 text-gray-900">{{ action }} Indicator</h1>

    <div class="glass-card p-8 rounded-xl">
        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Indicator Code</label>
                <input name="indicator_code" value="{{ indicator.indicator_code if indicator }}"
                    placeholder="e.g. SP.POP.TOTL"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-white/50 backdrop-blur-sm"
                    required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Indicator Name</label>
                <input name="indicator_name" value="{{ indicator.indicator_name if indicator }}"
                    placeholder="e.g. Population, total"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-white/50 backdrop-blur-sm"
                    required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Source</label>
                <select name="source_id"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-white/50 backdrop-blur-sm"
                    required>
                    <option value="">Select a Source</option>
                    {% for s in sources %}
                    <option value="{{ s.id }}" {% if indicator and indicator.source_id==s.id %}selected{% endif %}>
                        {{ s.source_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                <select name="category_id"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-white/50 backdrop-blur-sm"
                    required>
                    <option value="">Select a Category</option>
                    {% for c in categories %}
                    <option value="{{ c.id }}" {% if indicator and indicator.category_id==c.id %}selected{% endif %}>
                        {{ c.category_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Definition</label>
                <textarea name="long_definition" rows="4"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-white/50 backdrop-blur-sm"
                    placeholder="Detailed definition...">{{ indicator.long_definition if indicator }}</textarea>
            </div>

            <div class="flex justify-end space-x-4 pt-4">
                <a href="{{ url_for('indicators') }}"
                    class="px-6 py-2 rounded-lg text-gray-700 hover:bg-gray-100 transition-colors">Cancel</a>
                <button type="submit"
                    class="btn-primary px-8 py-2 rounded-lg shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5">
                    {{ action }} Indicator
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
