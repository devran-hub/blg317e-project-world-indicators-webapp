{% extends "base.html" %}
{% block title %}Region Form{% endblock %}

{% block content %}
<div class="animate-fade-in max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold mb-6 text-gray-900">{{ action }} Region</h1>

    <div class="glass-card p-8 rounded-xl">
        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Region Name</label>
                <input name="region_name" value="{{ region.region_name if region }}"
                    placeholder="e.g. Europe & Central Asia"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-white/50 backdrop-blur-sm"
                    required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Region Code</label>
                <input name="region_code" value="{{ region.region_code if region }}" placeholder="e.g. ECS"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-white/50 backdrop-blur-sm">
            </div>

            <div class="flex justify-end space-x-4 pt-4">
                <a href="{{ url_for('regions') }}"
                    class="px-6 py-2 rounded-lg text-gray-700 hover:bg-gray-100 transition-colors">Cancel</a>
                <button type="submit"
                    class="btn-primary px-8 py-2 rounded-lg shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5">
                    {{ action }} Region
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
