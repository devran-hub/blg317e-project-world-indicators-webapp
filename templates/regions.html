{% extends "base.html" %}
{% block title %}Regions{% endblock %}

{% block content %}

<h1 class="text-3xl font-bold mb-6">Regions</h1>

<div class="card mb-5">
    <form action="/regions/add" method="POST" class="flex gap-4">
        <input name="region_name" placeholder="Region Name" class="border p-2 rounded w-1/3">
        <input name="region_code" placeholder="Code" class="border p-2 rounded w-1/4">
        <button class="btn btn-blue">Add</button>
    </form>
</div>

<div class="card">
    <table class="w-full">
        <thead>
            <tr class="border-b text-left">
                <th class="py-2">Name</th>
                <th>Code</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for r in regions %}
            <tr class="border-b">
                <td class="py-2">{{ r.region_name }}</td>
                <td>{{ r.region_code }}</td>
                <td class="text-right">
                    
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
