{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="animate-fade-in max-w-md mx-auto mt-20">
    <div class="glass-card p-8 rounded-xl text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 mb-6">
            <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                </path>
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-gray-900 mb-2">Admin Login</h1>
        <p class="text-gray-600 mb-8">Please sign in to access the admin panel</p>

        <form method="POST" class="space-y-6 text-left">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input name="username" type="text" required
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-white/50 backdrop-blur-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input name="password" type="password" required
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-white/50 backdrop-blur-sm">
            </div>

            <button type="submit"
                class="w-full btn-primary py-2 rounded-lg shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5">
                Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
