{% extends "base.html" %}
{% block title %}Source Form{% endblock %}

{% block content %}
<div class="animate-fade-in max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold mb-6 text-gray-900">{{ action }} Source</h1>

    <div class="glass-card p-8 rounded-xl">
        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Source Name</label>
                <input name="source_name" value="{{ source.source_name if source }}" placeholder="e.g. World Bank"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-white/50 backdrop-blur-sm"
                    required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Organization</label>
                <input name="source_organization" value="{{ source.source_organization if source }}"
                    placeholder="e.g. The World Bank Group"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-white/50 backdrop-blur-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">URL</label>
                <input name="source_url" value="{{ source.source_url if source }}"
                    placeholder="e.g. https://data.worldbank.org"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-white/50 backdrop-blur-sm">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                <textarea name="description" rows="4"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-white/50 backdrop-blur-sm"
                    placeholder="Brief description of the source...">{{ source.description if source }}</textarea>
            </div>

            <div class="flex justify-end space-x-4 pt-4">
                <a href="{{ url_for('sources') }}"
                    class="px-6 py-2 rounded-lg text-gray-700 hover:bg-gray-100 transition-colors">Cancel</a>
                <button type="submit"
                    class="btn-primary px-8 py-2 rounded-lg shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5">
                    {{ action }} Source
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
